<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
}

.cover {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 580px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  isolation: isolate;
  background: #f8eee2;
  color: #774610;
}

/* ВИДЕО ФОН */
.video-bg {
  position: absolute;
  inset: 0;
  z-index: -3;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* АЧЫК ШАМПАНЬ ТҮСТҮҮ КАБАТ */
.cover::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background: linear-gradient(
    180deg,
    rgba(255, 249, 241, .76),
    rgba(255, 247, 237, .66),
    rgba(255, 250, 243, .80)
  );
}

/* АЛТЫН РАМКА */
.frame {
  position: absolute;
  inset: 22px;
  z-index: -1;
  border: 1px solid rgba(183, 126, 52, .85);
  pointer-events: none;
}

.frame::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(190, 148, 87, .4);
}

/* БАРДЫК ЖАЗУУЛАР */
.content {
  position: relative;
  width: 100%;
  max-width: 760px;
  max-height: 100%;
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 2;
}

/* ЖҮРӨКТӨРДҮН БЕЛГИСИ */
.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 18px;
  color: #a87329;
}

.logo::before,
.logo::after {
  content: "";
  width: clamp(40px, 10vw, 90px);
  height: 1px;
  background: #b88b4d;
}

.rings {
  position: relative;
  font-family: Georgia, serif;
  font-size: 43px;
  line-height: 1;
}

.rings::after {
  content: "♥";
  position: absolute;
  top: -12px;
  left: 43%;
  font-size: 13px;
  color: #b88940;
}

/* ЧАКЫРУУ */
.eyebrow {
  margin-bottom: 35px;
  color: #744510;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(15px, 2.7vw, 23px);
  font-weight: 600;
  line-height: 1.65;
  letter-spacing: 6px;
}

/* АТТАР */
.name {
  color: #86500d;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(53px, 10.5vw, 105px);
  font-weight: 600;
  line-height: .96;
  letter-spacing: -2px;
  white-space: nowrap;
  text-shadow: 0 2px 1px rgba(255,255,255,.8);
}

.name .initial {
  font-family: 'Great Vibes', cursive;
  font-size: 1.35em;
  font-weight: 400;
  letter-spacing: -5px;
}

/* ОРТОДОГУ & */
.ampersand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: 100%;
  margin: 5px 0;
  color: #a36a22;
  font-family: 'Great Vibes', cursive;
  font-size: clamp(65px, 10vw, 96px);
  line-height: .95;
}

.ampersand::before,
.ampersand::after {
  content: "";
  width: 25%;
  max-width: 175px;
  height: 1px;
  background: #a36a22;
}

/* УРААН */
.slogan {
  margin-top: 31px;
  color: #76451c;
  font-family: 'Great Vibes', cursive;
  font-size: clamp(28px, 5vw, 46px);
  line-height: 1.25;
}

.heart-divider {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-top: 12px;
  color: #b18036;
  font-size: 22px;
}

.heart-divider::before,
.heart-divider::after {
  content: "";
  width: 90px;
  height: 1px;
  background: #b18036;
}

/* ДАТА */
.date {
  margin-top: 22px;
  color: #784713;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(27px, 5vw, 42px);
  font-weight: 600;
  letter-spacing: 6px;
}

.date-decoration {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 10px;
  color: #ad7a39;
  font-size: 22px;
}

.date-decoration::before,
.date-decoration::after {
  content: "";
  width: 65px;
  height: 1px;
  background: #ad7a39;
}

/* УЛАНТУУ БАСКЫЧЫ */
.continue-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 17px;
  min-width: 245px;
  min-height: 62px;
  padding: 13px 26px;
  margin-top: 37px;
  border: 1px solid #b17c35;
  outline: 1px solid rgba(255,255,255,.95);
  outline-offset: 4px;
  border-radius: 50px;
  background: rgba(255, 250, 243, .65);
  color: #754817;
  text-decoration: none;
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 5px;
  transition: .3s;
}

.continue-btn:hover {
  background: #a87532;
  color: white;
}

.arrow {
  font-family: Arial, sans-serif;
  font-size: 24px;
}

/* ТҮШҮҮЧҮ ЖҮРӨКЧӨЛӨР */
.heart {
  position: absolute;
  top: -45px;
  z-index: 1;
  color: #c91535;
  text-shadow:
    0 2px 4px rgba(140, 0, 25, .25),
    0 0 10px rgba(255, 80, 100, .15);
  pointer-events: none;
  user-select: none;
  animation: heartFall linear infinite;
  will-change: transform, opacity;
}

@keyframes heartFall {
  0% {
    transform: translate3d(0, -45px, 0) rotate(-15deg) scale(.8);
    opacity: 0;
  }

  12% {
    opacity: .9;
  }

  50% {
    transform: translate3d(22px, 50vh, 0) rotate(20deg) scale(1);
  }

  85% {
    opacity: .8;
  }

  100% {
    transform: translate3d(-15px, 110vh, 0) rotate(45deg) scale(.9);
    opacity: 0;
  }
}

/* ТЕЛЕФОН */
@media (max-width: 480px) {
  .frame {
    inset: 12px;
  }

  .content {
    padding: 15px 10px;
  }

  .logo {
    margin-bottom: 15px;
  }

  .rings {
    font-size: 38px;
  }

  .eyebrow {
    margin-bottom: 27px;
    font-size: 16px;
    letter-spacing: 4px;
  }

  .name {
    font-size: clamp(49px, 13vw, 64px);
    letter-spacing: -1px;
  }

  .name .initial {
    letter-spacing: -4px;
  }

  .ampersand {
    gap: 10px;
    font-size: 70px;
  }

  .slogan {
    margin-top: 25px;
    font-size: 31px;
  }

  .heart-divider {
    margin-top: 10px;
  }

  .heart-divider::before,
  .heart-divider::after {
    width: 58px;
  }

  .date {
    margin-top: 20px;
    font-size: 28px;
    letter-spacing: 4px;
  }

  .continue-btn {
    min-width: 220px;
    min-height: 55px;
    margin-top: 28px;
    font-size: 17px;
  }
}

/* ЭКРАН БИЙИКТИГИ АЗ БОЛГОНДО */
@media (max-height: 720px) {
  .content {
    transform: scale(.82);
  }

  .eyebrow {
    margin-bottom: 17px;
  }

  .slogan {
    margin-top: 19px;
  }

  .date {
    margin-top: 15px;
  }

  .continue-btn {
    margin-top: 22px;
  }
}
</style>
</head>

<body>

<main class="cover">

  <!-- ВИДЕО ФОН: video.mp4 -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <div class="frame"></div>

  <section class="content">

    <div class="logo">
      <div class="rings">♡♡</div>
    </div>

    <p class="eyebrow">
      Тойго чакыруу
    </p>

    <div class="name">
      <span class="initial"></span>АТАБЕК
    </div>

    <div class="ampersand">&amp;</div>

    <div class="name">МАДИНА</div>

   

    <div class="heart-divider">♥</div>

    <p class="date">25.10.2026</p>

    <div class="date-decoration">✾</div>

    <!-- БУЛ ЖЕРГЕ КИЙИНКИ БЕТТИН ШИЛТЕМЕСИН КОЙ -->
    <a class="continue-btn"https://dream-juicy-moorhen.tilda.ws/">
      УЛАНТУУ <span class="arrow">→</span>
    </a>

  </section>

</main>

<script>
const cover = document.querySelector(".cover");

for (let i = 0; i < 28; i++) {
  const heart = document.createElement("span");

  heart.className = "heart";
  heart.textContent = Math.random() > 0.5 ? "♥" : "❤";

  heart.style.left = Math.random() * 100 + "%";
  heart.style.fontSize = (12 + Math.random() * 17) + "px";
  heart.style.animationDuration = (7 + Math.random() * 9) + "s";
  heart.style.animationDelay = (-Math.random() * 15) + "s";

  if (Math.random() > 0.65) {
    heart.style.color = "#e58b9b";
  }

  cover.appendChild(heart);
}
</script>

</body>
